<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カメラ配信</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #eee; }
  video { width: 100%; max-width: 960px; background: #000; }
  #status { margin: 12px 0; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <div id="status">読み込み中...</div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    // MediaMTXが同じホストのポート8888でHLSを配信している想定。
    // Cloudflare Tunnel経由で公開する場合は、トンネル側でこのパスを
    // ラズパイの 127.0.0.1:8888 に向けること。
    var streamUrl = "/pocket3/index.m3u8";
    var video = document.getElementById("video");
    var statusEl = document.getElementById("status");

    function setStatus(text) { statusEl.textContent = text; }

    if (Hls.isSupported()) {
      var hls = new Hls({ lowLatencyMode: true });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        setStatus("配信中");
        video.play().catch(function () {});
      });
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          setStatus("配信が見つかりません(カメラが配信中か確認してください)");
        }
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // Safari/iOSはネイティブHLS再生に対応
      video.src = streamUrl;
      video.addEventListener("loadedmetadata", function () {
        setStatus("配信中");
        video.play().catch(function () {});
      });
      video.addEventListener("error", function () {
        setStatus("配信が見つかりません(カメラが配信中か確認してください)");
      });
    } else {
      setStatus("このブラウザはHLS再生に対応していません");
    }
  </script>
</body>
</html>
